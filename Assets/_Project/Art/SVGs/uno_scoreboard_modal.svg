<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#E71D36"/>
    </linearGradient>
    <linearGradient id="rowWinnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A3B2A"/>
      <stop offset="100%" stop-color="#1B261B"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222630"/>
      <stop offset="100%" stop-color="#181A20"/>
    </linearGradient>
  </defs>

  <!-- Modal Container -->
  <rect x="20" y="20" width="560" height="440" rx="24" fill="#14171F" stroke="#2D3240" stroke-width="3" filter="url(#shadow)"/>

  <!-- Modal Header Banner -->
  <path d="M 20 44 A 24 24 0 0 1 44 20 L 556 20 A 24 24 0 0 1 580 44 L 580 90 L 20 90 Z" fill="url(#headerGrad)"/>
  <text x="300" y="62" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#111318" text-anchor="middle" letter-spacing="1">ROUND COMPLETED!</text>

  <!-- Player 1 (Winner / Human Player) -->
  <g transform="translate(40, 115)">
    <rect width="520" height="64" rx="12" fill="url(#rowWinnerGrad)" stroke="#00B865" stroke-width="2"/>
    <!-- Rank Badge -->
    <circle cx="40" cy="32" r="20" fill="#FFC700"/>
    <text x="40" y="38" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#111" text-anchor="middle">1st</text>
    <!-- Avatar & Name -->
    <text x="80" y="32" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">YOU (Player 1)</text>
    <text x="80" y="50" font-family="'Outfit', sans-serif" font-size="12" fill="#00E676" font-weight="700">WINNER — 0 Cards Left</text>
    <!-- Points -->
    <text x="480" y="38" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#FFC700" text-anchor="end">+180 PTS</text>
  </g>

  <!-- Player 2 (AI Bot 2) -->
  <g transform="translate(40, 192)">
    <rect width="520" height="58" rx="12" fill="url(#rowGrad)" stroke="#2D3240" stroke-width="1"/>
    <circle cx="40" cy="29" r="18" fill="#2D3240"/>
    <text x="40" y="35" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#A0AEC0" text-anchor="middle">2nd</text>
    <text x="80" y="30" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Bot Alex (Top)</text>
    <text x="80" y="46" font-family="'Outfit', sans-serif" font-size="12" fill="#A0AEC0">2 Cards Remaining (Skip, 5)</text>
    <text x="480" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="end">25 Pts Hand</text>
  </g>

  <!-- Player 3 (AI Bot 1) -->
  <g transform="translate(40, 262)">
    <rect width="520" height="58" rx="12" fill="url(#rowGrad)" stroke="#2D3240" stroke-width="1"/>
    <circle cx="40" cy="29" r="18" fill="#2D3240"/>
    <text x="40" y="35" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#A0AEC0" text-anchor="middle">3rd</text>
    <text x="80" y="30" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Bot Sarah (Left)</text>
    <text x="80" y="46" font-family="'Outfit', sans-serif" font-size="12" fill="#A0AEC0">3 Cards Remaining (+2, 8, Wild)</text>
    <text x="480" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="end">78 Pts Hand</text>
  </g>

  <!-- Player 4 (AI Bot 3) -->
  <g transform="translate(40, 332)">
    <rect width="520" height="58" rx="12" fill="url(#rowGrad)" stroke="#2D3240" stroke-width="1"/>
    <circle cx="40" cy="29" r="18" fill="#2D3240"/>
    <text x="40" y="35" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#A0AEC0" text-anchor="middle">4th</text>
    <text x="80" y="30" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Bot David (Right)</text>
    <text x="80" y="46" font-family="'Outfit', sans-serif" font-size="12" fill="#A0AEC0">4 Cards Remaining (+4, 9, Reverse, 3)</text>
    <text x="480" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="end">77 Pts Hand</text>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(300, 420)">
    <!-- Play Again Button -->
    <rect x="-140" y="-20" width="130" height="40" rx="20" fill="#00B865" stroke="#00E676" stroke-width="1.5"/>
    <text x="-75" y="5" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">NEXT ROUND</text>
    <!-- Main Menu Button -->
    <rect x="10" y="-20" width="130" height="40" rx="20" fill="#222630" stroke="#33394B" stroke-width="1.5"/>
    <text x="75" y="5" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#A0AEC0" text-anchor="middle">MAIN MENU</text>
  </g>
</svg>
