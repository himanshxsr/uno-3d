<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="yellowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FFC700"/>
      <stop offset="100%" stop-color="#E6A100"/>
    </linearGradient>
    <linearGradient id="whiteOvalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="232" height="328" rx="18" fill="url(#cardBorderGrad)" filter="url(#cardShadow)"/>
  <rect x="12" y="12" width="216" height="312" rx="14" fill="url(#yellowBgGrad)"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(24, 28)">
    <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" font-style="italic">+2</text>
  </g>

  <!-- Bottom-Right Corner Index -->
  <g transform="translate(216, 308) rotate(180)">
    <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" font-style="italic">+2</text>
  </g>

  <!-- Center Slanted Oval -->
  <g transform="translate(120, 168) rotate(-22)">
    <ellipse cx="0" cy="0" rx="92" ry="50" fill="url(#whiteOvalGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#cardShadow)"/>
  </g>

  <!-- Center +2 Cards Graphic -->
  <g transform="translate(120, 168)">
    <!-- Back Mini Card -->
    <rect x="-24" y="-30" width="30" height="44" rx="4" fill="#FFC700" stroke="#000000" stroke-width="2" transform="rotate(-15)"/>
    <!-- Front Mini Card -->
    <rect x="-10" y="-20" width="30" height="44" rx="4" fill="#FFC700" stroke="#000000" stroke-width="2" transform="rotate(10)"/>
    <text x="-32" y="24" font-family="'Impact', sans-serif" font-size="54" font-weight="900" fill="#333333" font-style="italic">+2</text>
  </g>
</svg>
